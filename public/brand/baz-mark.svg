<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="BAZventures">
  <title>BAZventures — signature mark</title>
  <!-- BAZ Mark — the monogram for tight contexts (favicon, avatar, nav, app icon).
       Æther + Gold: gold tile #EEB32B, near-black B #0A0A0A, square corners. -->
  <rect width="120" height="120" fill="#EEB32B"/>
  <text x="60" y="86" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="78" font-weight="700" fill="#0A0A0A" text-anchor="middle" letter-spacing="-2">B</text>
</svg>